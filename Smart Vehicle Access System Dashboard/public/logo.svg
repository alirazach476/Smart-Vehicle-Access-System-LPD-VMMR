<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" image-rendering="optimizeQuality">
  <defs>
    <!-- Main gradient: blue to purple -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#9333ea;stop-opacity:1" />
    </linearGradient>
    <!-- Light accent gradient -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60a5fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a78bfa;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle with gradient -->
  <circle cx="100" cy="100" r="85" fill="url(#mainGradient)" />
  
  <!-- Gate/Barrier Structure -->
  <g transform="translate(100, 100)">
    <!-- Left pillar -->
    <rect x="-45" y="-35" width="10" height="45" fill="white" opacity="0.95" rx="2" />
    <!-- Right pillar -->
    <rect x="35" y="-35" width="10" height="45" fill="white" opacity="0.95" rx="2" />
    <!-- Horizontal beam -->
    <rect x="-45" y="-35" width="90" height="7" fill="white" opacity="0.95" rx="2" />
    
    <!-- Vehicle (simplified car passing through) -->
    <g transform="translate(0, 5)">
      <!-- Car body -->
      <rect x="-18" y="-6" width="36" height="12" fill="white" opacity="0.98" rx="2.5" />
      <!-- Windshield -->
      <rect x="-14" y="-5" width="28" height="5" fill="url(#accentGradient)" opacity="0.7" rx="1" />
      <!-- Wheels -->
      <circle cx="-10" cy="6" r="3.5" fill="white" opacity="0.9" />
      <circle cx="10" cy="6" r="3.5" fill="white" opacity="0.9" />
    </g>
    
    <!-- Smart Technology Indicator (AI/Scan icon - top) -->
    <g transform="translate(0, -50)">
      <!-- Outer ring (scanning effect) -->
      <circle cx="0" cy="0" r="10" fill="none" stroke="white" stroke-width="2" opacity="0.8" />
      <!-- Center dot (sensor) -->
      <circle cx="0" cy="0" r="4" fill="white" opacity="0.95" />
      <!-- Scanning lines -->
      <line x1="0" y1="0" x2="0" y2="-10" stroke="white" stroke-width="1.5" opacity="0.6" />
      <line x1="0" y1="0" x2="7" y2="-7" stroke="white" stroke-width="1.5" opacity="0.6" />
      <line x1="0" y1="0" x2="-7" y2="-7" stroke="white" stroke-width="1.5" opacity="0.6" />
    </g>
    
    <!-- Access Granted Indicator (checkmark badge - bottom right) -->
    <g transform="translate(30, 25)">
      <!-- Badge circle -->
      <circle cx="0" cy="0" r="10" fill="white" opacity="0.95" />
      <!-- Checkmark -->
      <path d="M -4 0 L -1 3 L 4 -3" 
            stroke="url(#mainGradient)" 
            stroke-width="2.5" 
            stroke-linecap="round" 
            stroke-linejoin="round" 
            fill="none" />
    </g>
  </g>
</svg>
